name: HML - DSIPS (testes)
on:
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - 'recuperar.html'
      - 'homologacao/**'
      - 'js/platform/acesso-sessao.js'
      - 'app.css'
      - 'js/modules/dsips/consulta-materiais*'
      - 'js/modules/dsips/cadastros-*'
      - 'js/modules/dsips/estoque-*'
      - 'js/modules/dsips/painel-*'
      - 'js/modules/dsips/pdv-*'
      - 'tests/hml-ux-pdv.test.mjs'
      - 'js/modules/dsips/module.js'
      - 'tests/hml-ux-painel.test.mjs'
      - 'js/modules/dsips/ajustes-*'
      - 'js/modules/dsips/registro-cautelas-*'
      - 'js/modules/dsips/devolucoes-model.js'
      - 'js/modules/dsips/posse-*'
      - 'js/modules/dsips/historico-*'
      - 'js/modules/dsips/service.js'
      - 'service-worker.js'
      - 'js/pwa.js'
      - 'tests/**'
      - 'tests/contrato-versao.mjs'
      - 'js/ui/navigation.js'
      - 'js/ui/central-trabalho.js'
      - 'tests/hml-ux-central.test.mjs'
      - 'tests/hml-dsips-consulta.test.mjs'
      - 'tests/hml-dsips-mobile-layout.test.mjs'
      - 'tests/hml-dsips-cadastro-materiais.test.mjs'
      - 'tests/hml-dsips-visual-materiais.test.mjs'
      - 'tests/hml-dsips-cadastros.test.mjs'
      - 'tests/hml-dsips-estoque.test.mjs'
      - 'tests/hml-dsips-ajustes.test.mjs'
      - 'tests/hml-dsips-registro-cautelas.test.mjs'
      - 'tests/hml-dsips-devolucoes.test.mjs'
      - 'tests/hml-dsips-posse.test.mjs'
      - 'tests/hml-dsips-historico.test.mjs'
      - '.github/workflows/hml-dsips-consulta.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências de testes de interface
        run: npm install --prefix tests --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Conferir sintaxe
        run: |
          node --check service-worker.js
          node --check js/pwa.js
          node --check app.js
          node --check js/platform/acesso-sessao.js
          node --check js/ui/navigation.js
          node --check js/ui/central-trabalho.js
          node --check js/modules/dsips/consulta-materiais-model.js
          node --check js/modules/dsips/consulta-materiais-ui.js
          node --check js/modules/dsips/cadastros-model.js
          node --check js/modules/dsips/cadastros-ui.js
          node --check js/modules/dsips/estoque-model.js
          node --check js/modules/dsips/estoque-ui.js
          node --check js/modules/dsips/painel-bi-model.js
          node --check js/modules/dsips/painel-bi-ui.js
          node --check js/modules/dsips/painel-ui.js
          node --check js/core/cache-consultas.js
          node --check js/ui/paginador.js
          node --check js/ui/autocomplete.js
          node --check js/modules/dsips/pdv-model.js
          node --check js/modules/dsips/painel-model.js
          node --check js/modules/dsips/ajustes-model.js
          node --check js/modules/dsips/ajustes-ui.js
          node --check js/modules/dsips/registro-cautelas-model.js
          node --check js/modules/dsips/registro-cautelas-ui.js
          node --check js/modules/dsips/devolucoes-model.js
          node --check js/modules/dsips/posse-model.js
          node --check js/modules/dsips/posse-ui.js
          node --check js/modules/dsips/historico-model.js
          node --check js/modules/dsips/historico-ui.js
          node --input-type=module --check < js/modules/dsips/service.js
      - name: Executar testes da sprint
        run: node --test tests/hml-dsips-consulta.test.mjs tests/hml-dsips-mobile-layout.test.mjs tests/hml-dsips-cadastro-materiais.test.mjs tests/hml-dsips-visual-materiais.test.mjs tests/hml-dsips-cadastros.test.mjs tests/hml-dsips-estoque.test.mjs tests/hml-dsips-registro-cautelas.test.mjs tests/hml-dsips-devolucoes.test.mjs tests/hml-dsips-posse.test.mjs tests/hml-dsips-historico.test.mjs tests/hml-dsips-ajustes.test.mjs tests/hml-ux-central.test.mjs tests/hml-ux-painel.test.mjs tests/hml-ux-pdv.test.mjs tests/hml-ux-gestao.test.mjs tests/hml-ux-patrimonio.test.mjs tests/hml-ux-polimento.test.mjs tests/hml-ux-fila.test.mjs tests/hml-ux-pdv-refino.test.mjs tests/hml-ux-cadastros-unificados.test.mjs tests/hml-ux-timeline.test.mjs tests/hml-ux-auditoria.test.mjs tests/hml-perf-autocomplete.test.mjs tests/hml-ux-cautelas-kpi.test.mjs tests/hml-bi-dsips.test.mjs tests/hml-perf-selects.test.mjs tests/hml-perf-paginacao.test.mjs tests/hml-perf-cache.test.mjs tests/hml-qa-acesso.test.mjs tests/hml-qa-pwa.test.mjs tests/cautelas-ui.test.mjs tests/dsips-ui.test.mjs tests/proposta-acessos.test.mjs tests/hml-qa-integrada.test.mjs tests/hml-login-bootstrap.test.mjs tests/hml-pwa-recuperacao.test.mjs tests/hml-pwa-watchdog.test.mjs tests/hml-dsips-piloto.test.mjs tests/hml-entrada-unica-v2.test.mjs
      - name: Testar migração real do worker em Chromium
        run: |
          npm install --prefix tests --no-save --ignore-scripts --no-audit --no-fund --no-package-lock playwright-core@1.51.1
          CHROME_PATH="$(command -v google-chrome || command -v chromium)" node tests/hml-pwa-migracao.browser.mjs
      - name: Comparar suíte geral com a base HML
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          BASE_DIR="$RUNNER_TEMP/cmapp-base"
          git worktree add --detach "$BASE_DIR" "$BASE_SHA"
          trap 'git worktree remove --force "$BASE_DIR"' EXIT
          # Instala as dependências de teste declaradas pela própria base,
          # quando existirem, para uma comparação nas mesmas condições.
          if [ -f "$BASE_DIR/tests/package.json" ]; then
            npm install --prefix "$BASE_DIR/tests" --ignore-scripts --no-audit --no-fund --no-package-lock
          fi
          BASE_RC=0
          CAND_RC=0
          (cd "$BASE_DIR" && node --test --test-reporter=tap tests/*.test.mjs) > "$RUNNER_TEMP/cmapp-base.tap" 2>&1 || BASE_RC=$?
          node --test --test-reporter=tap tests/*.test.mjs > "$RUNNER_TEMP/cmapp-candidato.tap" 2>&1 || CAND_RC=$?
          if [ "$BASE_RC" -gt 1 ] || [ "$CAND_RC" -gt 1 ]; then
            echo "Falha na execução do runner de testes."
            exit 1
          fi
          python3 - "$RUNNER_TEMP/cmapp-base.tap" "$RUNNER_TEMP/cmapp-candidato.tap" <<'PY'
          from collections import Counter
          from pathlib import Path
          import re
          import sys

          def analisar(arquivo):
              conteudo = Path(arquivo).read_text()
              stats = {}
              for campo in ('tests', 'pass', 'fail', 'cancelled', 'skipped', 'todo'):
                  valores = re.findall(r'^# ' + campo + r' (\d+)$', conteudo, re.M)
                  if not valores:
                      raise SystemExit('Relatório incompleto: ' + arquivo)
                  stats[campo] = int(valores[-1])
              falhas = Counter(re.findall(r'^not ok \d+ - (.+)$', conteudo, re.M))
              if sum(falhas.values()) != stats['fail']:
                  raise SystemExit('Contagem de falhas inconsistente: ' + arquivo)
              return stats, falhas

          base, falhas_base = analisar(sys.argv[1])
          cand, falhas_cand = analisar(sys.argv[2])
          print('BASE:', base)
          print('CANDIDATO:', cand)
          print('FALHAS PRESENTES ANTES:', sorted(falhas_base.elements()))
          print('FALHAS PERSISTENTES:', sorted((falhas_base & falhas_cand).elements()))
          # QA-01: diagnóstico mínimo sem reproduzir dumps de código.
          relatorio = Path(sys.argv[2]).read_text()
          blocos = re.split(r'(?m)^not ok \d+ - ', relatorio)[1:]
          for bloco in blocos:
              linhas = bloco.splitlines()
              nome = linhas[0]
              corpo = '\n'.join(linhas[1:]).split('\n  ...',1)[0]
              local = re.search(r"(?m)^  location: (.+)$", corpo)
              tipo = re.search(r"(?m)^  failureType: (.+)$", corpo)
              codigo = re.search(r"(?m)^  code: (.+)$", corpo)
              erro = re.search(r"(?m)^    (?:The input did not match the regular expression|Cannot find |ENOENT:|Error:|Expected values|The expression evaluated)[^\n]*", corpo)
              print('QA DIAGNOSTICO:', nome, '|', local.group(1) if local else '', '|', tipo.group(1) if tipo else '', '|', codigo.group(1) if codigo else '', '|', erro.group(0).strip()[:240] if erro else '')
          novas = falhas_cand - falhas_base
          print('NOVAS FALHAS:', sorted(novas.elements()))
          print('FALHAS RESOLVIDAS:', sorted((falhas_base - falhas_cand).elements()))
          if novas or cand['cancelled'] > base['cancelled'] or cand['skipped'] > base['skipped'] or cand['todo'] > base['todo'] or cand['tests'] < base['tests']:
              raise SystemExit('Regressão nova ou perda de cobertura.')
          print('SEM NOVAS FALHAS NA SUÍTE GERAL; conferir a rotina HML obrigatória.')
          PY
