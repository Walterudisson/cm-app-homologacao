name: HML - DSIPS (testes)
on:
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - 'app.css'
      - 'js/modules/dsips/consulta-materiais*'
      - 'js/modules/dsips/cadastros-*'
      - 'js/modules/dsips/estoque-*'
      - 'js/modules/dsips/registro-cautelas-*'
      - 'js/modules/dsips/devolucoes-model.js'
      - 'js/modules/dsips/posse-*'
      - 'service-worker.js'
      - 'js/ui/navigation.js'
      - 'tests/hml-dsips-consulta.test.mjs'
      - 'tests/hml-dsips-mobile-layout.test.mjs'
      - 'tests/hml-dsips-cadastro-materiais.test.mjs'
      - 'tests/hml-dsips-visual-materiais.test.mjs'
      - 'tests/hml-dsips-cadastros.test.mjs'
      - 'tests/hml-dsips-estoque.test.mjs'
      - 'tests/hml-dsips-registro-cautelas.test.mjs'
      - 'tests/hml-dsips-devolucoes.test.mjs'
      - 'tests/hml-dsips-posse.test.mjs'
      - '.github/workflows/hml-dsips-consulta.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir sintaxe
        run: |
          node --check app.js
          node --check js/ui/navigation.js
          node --check js/modules/dsips/consulta-materiais-model.js
          node --check js/modules/dsips/consulta-materiais-ui.js
          node --check js/modules/dsips/cadastros-model.js
          node --check js/modules/dsips/cadastros-ui.js
          node --check js/modules/dsips/estoque-model.js
          node --check js/modules/dsips/estoque-ui.js
          node --check js/modules/dsips/registro-cautelas-model.js
          node --check js/modules/dsips/registro-cautelas-ui.js
          node --check js/modules/dsips/devolucoes-model.js
          node --check js/modules/dsips/posse-model.js
          node --check js/modules/dsips/posse-ui.js
      - name: Executar testes da sprint
        run: node --test tests/hml-dsips-consulta.test.mjs tests/hml-dsips-mobile-layout.test.mjs tests/hml-dsips-cadastro-materiais.test.mjs tests/hml-dsips-visual-materiais.test.mjs tests/hml-dsips-cadastros.test.mjs tests/hml-dsips-estoque.test.mjs tests/hml-dsips-registro-cautelas.test.mjs tests/hml-dsips-devolucoes.test.mjs tests/hml-dsips-posse.test.mjs
